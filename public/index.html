<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07070d">
    <title>لیگ قهرمانان رشد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #FFD700; --gold-dark: #B8860B;
            --bg: #07070d; --card: rgba(255,255,255,.045); --line: rgba(255,215,0,.13);
            --muted: #8d8d9b; --ok: #4ade80; --bad: #ff6b6b; --r: 20px;
        }
        * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin: 0; background: var(--bg); color: #fff; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; line-height: 1.7; }
        button, input, select, textarea { font: inherit; }
        .hidden { display: none !important; }
        .muted { color: var(--muted); }
        .gold-text { color: var(--gold); }
        .pos { color: var(--ok); } .neg { color: var(--bad); }
        .center { text-align: center; }

        /* پس‌زمینه */
        .bg-glow { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .glow-circle { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .14; }
        .circle-1 { width: 420px; height: 420px; background: var(--gold); top: -160px; right: -160px; }
        .circle-2 { width: 360px; height: 360px; background: #5a5a6a; bottom: -120px; left: -120px; }

        /* قالب کلی */
        .app { max-width: 720px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
        .stack > * + * { margin-top: 14px; }
        .sec-title { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; margin: 0 0 16px; }
        .sec-title .chip { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,215,0,.12); color: var(--gold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .anim-pop { animation: popIn .35s ease-out both; }
        @keyframes popIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* دکمه‌ها و فرم */
        .btn-gold, .btn-outline, .btn-green, .btn-red { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 14px; border: 1px solid transparent; cursor: pointer; font-weight: 800; transition: transform .15s, box-shadow .2s; }
        .btn-gold { background: linear-gradient(45deg, var(--gold), var(--gold-dark)); color: #000; box-shadow: 0 0 16px rgba(255,215,0,.25); }
        .btn-green { background: linear-gradient(45deg, #34d058, #12a63a); color: #031a08; }
        .btn-red { background: linear-gradient(45deg, #ff5a5a, #c81e1e); color: #fff; }
        .btn-outline { background: transparent; border-color: rgba(255,215,0,.3); color: var(--gold); }
        .btn-outline.danger { color: var(--bad); border-color: rgba(255,107,107,.4); }
        .btn-gold:active, .btn-outline:active, .btn-green:active, .btn-red:active { transform: scale(.97); }
        .btn-block { width: 100%; }
        .btn-gold:disabled { opacity: .6; }
        .icon-btn { width: 42px; height: 42px; border-radius: 13px; border: 1px solid var(--line); background: var(--card); color: var(--gold); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .icon-btn:active { transform: scale(.94); }

        .field { position: relative; margin-bottom: 12px; }
        .field > i.lead { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #666; pointer-events: none; }
        .field .toggle { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: transparent; color: #888; cursor: pointer; }
        .neo-input { width: 100%; min-height: 50px; padding: 12px 14px; background: rgba(0,0,0,.4); border: 1px solid #2c2c38; border-radius: 14px; color: #fff; font-size: 16px; transition: border-color .2s, box-shadow .2s; }
        .field.has-icon .neo-input { padding-right: 44px; }
        .field.has-toggle .neo-input { padding-left: 48px; }
        .neo-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,215,0,.1); outline: none; }
        select.neo-input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #888 50%), linear-gradient(135deg, #888 50%, transparent 50%); background-position: 18px 50%, 12px 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-left: 36px; }
        textarea.neo-input { resize: vertical; min-height: 110px; }
        .error-box { display: flex; align-items: center; gap: 8px; background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.35); color: var(--bad); border-radius: 12px; padding: 10px 12px; font-size: .88rem; margin-bottom: 12px; text-align: right; }

        /* ورود */
        .login-wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
        .login-card { width: 100%; max-width: 420px; padding: 28px 22px; text-align: center; }
        .logo-ring { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: 0 0 36px rgba(255,215,0,.45); }
        .login-card h1 { margin: 0 0 6px; font-size: 1.8rem; font-weight: 900; color: var(--gold); }
        .login-card p { margin: 0 0 22px; color: var(--muted); font-size: .92rem; }

        /* نوار بالا */
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0 14px; }
        .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .who small { display: block; color: var(--muted); font-size: .7rem; line-height: 1.2; }
        .who b { display: block; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; line-height: 1.4; }
        .tools { display: flex; align-items: center; gap: 8px; }
        .points-chip { display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 13px; border-radius: 13px; background: rgba(255,215,0,.1); border: 1px solid var(--line); color: var(--gold); font-weight: 900; }

        /* نوار پایین موبایل */
        .tab-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; display: flex; gap: 2px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: rgba(10,10,18,.95); border-top: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; padding: 4px 2px; border-radius: 14px; color: #7d7d8c; font-size: .68rem; font-weight: 700; cursor: pointer; transition: background .2s, color .2s; position: relative; }
        .tab-btn i { font-size: 1.15rem; }
        .tab-btn.active { color: var(--gold); background: rgba(255,215,0,.09); }
        .tab-btn.active::before { content: ''; position: absolute; top: 0; width: 22px; height: 3px; border-radius: 0 0 4px 4px; background: var(--gold); }

        /* داشبورد */
        .hero { text-align: center; }
        .ring { --pct: 0; --c: var(--gold); width: 150px; height: 150px; margin: 4px auto 16px; border-radius: 50%; padding: 8px; background: conic-gradient(var(--c) calc(var(--pct) * 1%), rgba(255,255,255,.08) 0); box-shadow: 0 0 36px color-mix(in srgb, var(--c) 28%, transparent); }
        .ring-inner { width: 100%; height: 100%; border-radius: 50%; background: #0d0d16; display: flex; align-items: center; justify-content: center; font-size: 3.2rem; color: var(--c); }
        .hero h2 { margin: 0 0 2px; font-size: 1.6rem; font-weight: 900; }
        .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
        .bar > div { height: 100%; border-radius: 99px; transition: width 1s ease; }
        .bar-meta { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); margin: 18px 0 8px; }
        .hint { margin: 12px 0 0; font-size: .85rem; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .hint i { color: var(--gold); }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
        .stat { background: rgba(0,0,0,.3); border: 1px solid #1f1f2a; border-radius: 14px; padding: 10px 4px; }
        .stat i { color: var(--gold); font-size: .95rem; }
        .stat b { display: block; font-size: 1.15rem; font-weight: 900; line-height: 1.5; }
        .stat span { font-size: .7rem; color: var(--muted); }

        /* نردبان رشد */
        .ladder { --ic: 56px; position: relative; }
        .ladder-line { position: absolute; right: calc(var(--ic) / 2 - 2px); top: calc(var(--ic) / 2); bottom: calc(var(--ic) / 2); width: 4px; background: #20202b; border-radius: 2px; }
        .ladder-step { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; position: relative; z-index: 1; }
        .ladder-step:last-child { margin-bottom: 0; }
        .step-icon { width: var(--ic); height: var(--ic); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; background: #111119; border: 3px solid #2c2c38; color: #5a5a68; flex-shrink: 0; transition: .3s; }
        .step-content { flex: 1; min-width: 0; background: var(--card); border: 1px solid #22222d; padding: 12px 14px; border-radius: 16px; }
        .step-title { font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .step-desc { font-size: .82rem; color: #8a8a98; margin-top: 2px; }
        .tag { font-size: .65rem; font-weight: 800; padding: 1px 8px; border-radius: 99px; background: rgba(255,215,0,.15); color: var(--gold); }
        .ladder-step.locked .step-content { opacity: .55; }
        .ladder-step.active .step-icon { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border-color: var(--gold); box-shadow: 0 0 24px rgba(255,215,0,.55); }
        .ladder-step.active .step-content { border-color: var(--gold); background: rgba(255,215,0,.06); }
        .ladder-step.active .step-title { color: var(--gold); }
        .ladder-step.done .step-icon { background: rgba(74,222,128,.1); border-color: rgba(74,222,128,.5); color: var(--ok); }

        /* رتبه‌بندی */
        .podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin: 8px 0 18px; }
        .pod { flex: 1; max-width: 118px; min-width: 0; text-align: center; }
        .pod .av { position: relative; width: 52px; height: 52px; margin: 0 auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.15rem; border: 3px solid var(--pc); background: #14141d; }
        .pod.first .av { width: 64px; height: 64px; font-size: 1.45rem; }
        .pod .crown { position: absolute; top: -19px; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 1.15rem; }
        .pod .nm { font-size: .8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pod .pt { font-size: .78rem; font-weight: 800; color: var(--pc); }
        .pod .base { margin-top: 8px; border: 1px solid var(--pc); border-bottom: 0; border-radius: 12px 12px 0 0; background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.02)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--pc); font-weight: 900; }
        .pod.me .av { box-shadow: 0 0 0 3px rgba(255,215,0,.35); }
        .rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--card); border: 1px solid #22222d; border-radius: 16px; margin-bottom: 8px; }
        .rank-row.me { border-color: var(--gold); background: rgba(255,215,0,.07); }
        .rank-num { width: 30px; text-align: center; font-weight: 900; color: #aaa; flex-shrink: 0; }
        .rank-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; background: #1b1b25; flex-shrink: 0; }
        .rank-name { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-pts { font-weight: 900; white-space: nowrap; }
        .rank-pts small { color: var(--muted); font-weight: 400; font-size: .72rem; }

        /* پیام‌ها */
        .counter { font-size: .75rem; color: var(--muted); text-align: left; margin: -4px 2px 10px; }
        .bubble { padding: 10px 14px; border-radius: 16px; font-size: .92rem; word-break: break-word; white-space: pre-wrap; }
        .bubble.me { background: rgba(255,215,0,.1); border: 1px solid rgba(255,215,0,.22); border-top-right-radius: 4px; }
        .bubble.teacher { background: rgba(255,255,255,.06); border: 1px solid #2a2a36; border-top-left-radius: 4px; margin-top: 8px; margin-right: 22px; }
        .bubble.teacher b { color: var(--gold); display: flex; align-items: center; gap: 6px; font-size: .78rem; margin-bottom: 2px; }
        .msg-meta { font-size: .7rem; color: var(--muted); margin-top: 4px; }
        .msg-item { padding: 12px; background: rgba(0,0,0,.28); border: 1px solid #1f1f2a; border-radius: 16px; }
        .msg-item + .msg-item { margin-top: 10px; }
        .empty { text-align: center; color: var(--muted); padding: 26px 8px; }
        .empty i { display: block; font-size: 2rem; margin-bottom: 8px; color: #3a3a48; }
        .reply-row { display: flex; gap: 8px; margin-top: 10px; }
        .reply-row .neo-input { min-height: 46px; }

        /* مدیریت */
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .row-gap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .row-gap > * { flex: 1 1 140px; }
        .log-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 12px; background: rgba(0,0,0,.28); border: 1px solid #1f1f2a; border-radius: 12px; font-size: .85rem; }
        .log-row + .log-row { margin-top: 8px; }
        .log-row time { color: var(--muted); font-size: .7rem; white-space: nowrap; }

        /* اعلان */
        #toasts { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
        .toast { display: flex; align-items: center; gap: 10px; max-width: 460px; width: 100%; padding: 12px 16px; border-radius: 14px; background: #14141d; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: .9rem; font-weight: 600; animation: popIn .25s ease-out both; }
        .toast.ok i { color: var(--ok); } .toast.err { border-color: rgba(255,107,107,.45); } .toast.err i { color: var(--bad); }

        @media (min-width: 768px) {
            .app { padding-top: 28px; padding-bottom: 40px; }
            .card { padding: 26px; }
            .who b { max-width: 220px; }
            .tab-nav { position: static; background: none; border: 0; backdrop-filter: none; justify-content: center; gap: 10px; padding: 0; margin-bottom: 22px; }
            .tab-btn { flex: 0 0 auto; flex-direction: row; gap: 8px; min-height: 44px; padding: 0 20px; font-size: .9rem; background: var(--card); border: 1px solid #22222d; }
            .tab-btn i { font-size: 1rem; }
            .tab-btn.active { border-color: var(--gold); }
            .tab-btn.active::before { display: none; }
            .ladder { --ic: 72px; }
            .step-icon { font-size: 1.7rem; }
            .glow-circle { animation: float 12s infinite ease-in-out; }
        }
        @keyframes float { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(40px,24px); } }
        @media (hover: hover) { .btn-gold:hover, .btn-green:hover, .btn-red:hover { transform: translateY(-1px); } .btn-outline:hover, .icon-btn:hover { background: rgba(255,215,0,.1); } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="bg-glow"><div class="glow-circle circle-1"></div><div class="glow-circle circle-2"></div></div>
    <div id="toasts"></div>

    <!-- صفحه ورود -->
    <div id="login-screen" class="login-wrap">
        <div class="card login-card anim-pop">
            <div class="logo-ring"><i class="fas fa-trophy"></i></div>
            <h1>لیگ قهرمانان رشد</h1>
            <p>برای مشاهده امتیازات و مسیر قهرمانی وارد شوید</p>
            <div id="login-error" class="error-box hidden"><i class="fas fa-circle-exclamation"></i><span></span></div>
            <div class="field has-icon">
                <i class="fas fa-user lead"></i>
                <input type="text" id="login-user" class="neo-input" dir="auto" placeholder="نام کاربری (انگلیسی)" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
            </div>
            <div class="field has-icon has-toggle">
                <i class="fas fa-lock lead"></i>
                <input type="password" id="login-pass" class="neo-input" dir="auto" placeholder="رمز عبور" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
                <button type="button" class="toggle" aria-label="نمایش رمز" onclick="togglePass(this)"><i class="fas fa-eye"></i></button>
            </div>
            <button id="login-btn" class="btn-gold btn-block" onclick="doLogin()"><span>ورود به لیگ</span><i class="fas fa-arrow-left"></i></button>
        </div>
    </div>

    <!-- پنل اصلی -->
    <div id="main-panel" class="app hidden">
        <header class="topbar">
            <div class="who">
                <div class="avatar" id="my-avatar">؟</div>
                <div><small>خوش آمدی</small><b id="my-name">...</b></div>
            </div>
            <div class="tools">
                <div class="points-chip"><i class="fas fa-coins"></i><span id="my-points">0</span></div>
                <button class="icon-btn" onclick="changePassword()" aria-label="تغییر رمز"><i class="fas fa-key"></i></button>
                <button class="icon-btn" onclick="logout()" aria-label="خروج"><i class="fas fa-right-from-bracket"></i></button>
            </div>
        </header>

        <nav class="tab-nav">
            <div class="tab-btn active" onclick="showSection('dashboard', this)"><i class="fas fa-house"></i><span>داشبورد</span></div>
            <div class="tab-btn" onclick="showSection('ladder', this)"><i class="fas fa-stairs"></i><span>نردبان</span></div>
            <div class="tab-btn" onclick="showSection('leaderboard', this)"><i class="fas fa-ranking-star"></i><span>رتبه‌بندی</span></div>
            <div class="tab-btn" onclick="showSection('messages', this)"><i class="fas fa-envelope"></i><span>پیام</span></div>
            <div class="tab-btn hidden" id="admin-nav" onclick="showSection('admin', this)"><i class="fas fa-user-shield"></i><span>مدیریت</span></div>
        </nav>

        <!-- ۱. داشبورد -->
        <section id="section-dashboard" class="view card anim-pop"><div id="user-status-box" class="hero"></div></section>

        <!-- ۲. نردبان رشد -->
        <section id="section-ladder" class="view card hidden">
            <h2 class="sec-title"><span class="chip"><i class="fas fa-stairs"></i></span>مسیر قهرمانی شما</h2>
            <div class="ladder" id="ladder-box"></div>
        </section>

        <!-- ۳. رتبه‌بندی -->
        <section id="section-leaderboard" class="view card hidden">
            <h2 class="sec-title"><span class="chip"><i class="fas fa-ranking-star"></i></span>جدول برترین‌ها</h2>
            <div id="leaderboard-body"></div>
        </section>

        <!-- ۴. پیام‌ها -->
        <section id="section-messages" class="view card hidden">
            <h2 class="sec-title"><span class="chip"><i class="fas fa-paper-plane"></i></span><span>ارسال پیام به <span id="teacher-name">استاد</span></span></h2>
            <textarea id="msg-text" class="neo-input" maxlength="500" placeholder="پیام خود را اینجا بنویسید..." oninput="document.getElementById('msg-count').textContent=this.value.length"></textarea>
            <div class="counter"><span id="msg-count">0</span> / 500</div>
            <button class="btn-gold btn-block" onclick="sendMessage()"><i class="fas fa-paper-plane"></i><span>ارسال پیام</span></button>
            <h3 class="sec-title" style="margin-top:26px;font-size:.95rem;"><span class="chip" style="width:30px;height:30px;"><i class="fas fa-comments"></i></span>پیام‌های من</h3>
            <div id="my-messages-box"></div>
        </section>

        <!-- ۵. پنل مدیریت -->
        <section id="section-admin" class="view hidden stack">
            <div class="card">
                <h2 class="sec-title"><span class="chip"><i class="fas fa-award"></i></span>مدیریت امتیازات</h2>
                <div class="field"><select id="admin-user-select" class="neo-input"></select></div>
                <div class="grid2">
                    <div class="field" style="margin:0"><input type="number" inputmode="numeric" id="admin-points-input" class="neo-input" placeholder="مقدار امتیاز"></div>
                    <div class="field" style="margin:0"><input type="text" id="admin-reason-input" maxlength="200" class="neo-input" placeholder="دلیل (اختیاری)"></div>
                </div>
                <div class="grid2" style="margin-top:12px;">
                    <button class="btn-green" onclick="updatePoints(1)"><i class="fas fa-plus"></i><span>افزایش</span></button>
                    <button class="btn-red" onclick="updatePoints(-1)"><i class="fas fa-minus"></i><span>کاهش</span></button>
                </div>
                <div class="row-gap">
                    <button class="btn-outline" onclick="resetPassword()"><i class="fas fa-key"></i><span>بازنشانی رمز</span></button>
                    <button class="btn-outline danger" onclick="deleteStudent()"><i class="fas fa-trash"></i><span>حذف دانش‌آموز</span></button>
                </div>
            </div>

            <div class="card">
                <h2 class="sec-title"><span class="chip"><i class="fas fa-user-plus"></i></span>افزودن دانش‌آموز جدید</h2>
                <div class="field"><input type="text" id="new-user-display" class="neo-input" placeholder="نام نمایشی (فارسی)"></div>
                <div class="field"><input type="text" id="new-user-username" class="neo-input" dir="ltr" placeholder="نام کاربری (انگلیسی)" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
                <button class="btn-gold btn-block" onclick="addNewUser()"><i class="fas fa-check"></i><span>ثبت کاربر جدید</span></button>
            </div>

            <div class="card">
                <h2 class="sec-title"><span class="chip"><i class="fas fa-inbox"></i></span>صندوق پیام‌ها</h2>
                <div id="admin-messages-box"></div>
            </div>

            <div class="card">
                <h2 class="sec-title"><span class="chip"><i class="fas fa-clock-rotate-left"></i></span>تاریخچهٔ امتیازها</h2>
                <div id="admin-log-box"></div>
            </div>
        </section>
    </div>

    <script>
    // === وضعیت ===
    let token = localStorage.getItem('token');
    let me = null, board = [], myMessages = [], adminMessages = [], adminLog = [];

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fa = (d) => d ? new Date(d).toLocaleString('fa-IR', { dateStyle: 'short', timeStyle: 'short' }) : '';
    const $ = (id) => document.getElementById(id);

    function toast(msg, type = 'ok') {
        const el = document.createElement('div');
        el.className = 'toast ' + type;
        el.innerHTML = `<i class="fas ${type === 'ok' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i><span>${esc(msg)}</span>`;
        $('toasts').appendChild(el);
        setTimeout(() => el.remove(), 3200);
    }

    async function api(path, method = 'GET', body) {
        const res = await fetch('/api/' + path, {
            method,
            headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
            body: body ? JSON.stringify(body) : undefined
        });
        let data = {};
        try { data = await res.json(); } catch (e) {}
        if (res.status === 401 && path !== 'login') { localStorage.removeItem('token'); location.reload(); }
        if (!res.ok) throw new Error(data.error || 'خطا در ارتباط با سرور');
        return data;
    }
    const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, 'err'); } };

    // === ورود / خروج ===
    function togglePass(btn) {
        const inp = $('login-pass'); const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        btn.firstElementChild.className = 'fas ' + (show ? 'fa-eye-slash' : 'fa-eye');
    }
    function loginError(msg) {
        const box = $('login-error');
        box.classList.toggle('hidden', !msg);
        if (msg) box.querySelector('span').textContent = msg;
    }
    async function doLogin() {
        const username = $('login-user').value.trim().toLowerCase();
        const password = $('login-pass').value;
        if (!username || !password) return loginError('نام کاربری و رمز عبور را وارد کنید');
        const btn = $('login-btn');
        btn.disabled = true; loginError('');
        btn.firstElementChild.textContent = 'در حال ورود...';
        try {
            const r = await api('login', 'POST', { username, password });
            token = r.token; localStorage.setItem('token', token);
            await loadAll();
        } catch (e) { loginError(e.message); }
        btn.disabled = false; btn.firstElementChild.textContent = 'ورود به لیگ';
    }
    function logout() { localStorage.removeItem('token'); token = null; location.reload(); }

    const changePassword = guard(async () => {
        const oldPassword = prompt('رمز فعلی:');
        if (!oldPassword) return;
        const newPassword = prompt('رمز جدید (حداقل ۶ کاراکتر):');
        if (!newPassword) return;
        const r = await api('change-password', 'POST', { oldPassword, newPassword });
        token = r.token; localStorage.setItem('token', token);
        toast('رمز با موفقیت تغییر کرد');
    });

    // === بارگذاری داده ===
    async function loadAll() {
        me = await api('me');
        [board, myMessages] = await Promise.all([api('leaderboard'), api('my-messages')]);
        if (me.isAdmin) [adminMessages, adminLog] = await Promise.all([api('admin/messages'), api('admin/log')]);
        $('login-screen').classList.add('hidden');
        $('main-panel').classList.remove('hidden');
        $('admin-nav').classList.toggle('hidden', !me.isAdmin);
        $('teacher-name').textContent = me.teacherName;
        $('my-name').textContent = me.displayName;
        $('my-avatar').textContent = me.displayName.charAt(0);
        renderUI();
    }

    // === رندر ===
    function showSection(id, el) {
        document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
        if (el) el.classList.add('active');
        document.querySelectorAll('.view').forEach(e => e.classList.add('hidden'));
        const sec = $('section-' + id);
        if (sec) { sec.classList.remove('hidden'); sec.classList.remove('anim-pop'); void sec.offsetWidth; sec.classList.add('anim-pop'); }
        window.scrollTo({ top: 0 });
    }

    function renderUI() {
        $('my-points').textContent = me.points || 0;
        renderDashboard(); renderLadder(); renderLeaderboard(); renderMyMessages();
        if (me.isAdmin) renderAdminPanel();
    }

    const STAGES = [
        { min: 0, max: 49, name: 'مرحله شروع', icon: 'fa-seedling', color: '#8BC34A', next: 50 },
        { min: 50, max: 149, name: 'مرحله کاوش', icon: 'fa-magnifying-glass', color: '#03A9F4', next: 150 },
        { min: 150, max: 299, name: 'مرحله پیشرفت', icon: 'fa-chart-line', color: '#FF9800', next: 300 },
        { min: 300, max: 499, name: 'مرحله درخشش', icon: 'fa-star', color: '#E91E63', next: 500 },
        { min: 500, max: 99999, name: 'قله قهرمانی', icon: 'fa-trophy', color: '#FFD700', next: null }
    ];

    function renderDashboard() {
        const p = me.points || 0;
        const neg = p < 0;
        const stage = STAGES.find(s => p >= s.min && p <= s.max) || STAGES[0];
        const color = neg ? '#ff6b6b' : stage.color;
        const pct = neg ? 100 : stage.next ? Math.min(100, ((p - stage.min) / (stage.next - stage.min)) * 100) : 100;
        const idx = board.findIndex(u => u.username === me.username);
        const rankTxt = idx >= 0 ? (idx + 1).toLocaleString('fa-IR') : '—';
        const left = neg ? Math.abs(p) : stage.next ? stage.next - p : 0;

        let meta = '';
        if (neg) meta = `<div class="bar-meta"><span class="neg">هشدار</span><span class="neg">امتیاز شما منفی است</span></div>`;
        else if (stage.next) meta = `<div class="bar-meta"><span>پیشرفت تا مرحله بعد</span><span>${left} امتیاز مانده</span></div>`;
        else meta = `<div class="bar-meta"><span>بالاترین مرحله</span><span>تبریک!</span></div>`;

        $('user-status-box').innerHTML = `
            <div class="ring" style="--pct:${pct}; --c:${color};"><div class="ring-inner"><i class="fas ${neg ? 'fa-triangle-exclamation' : stage.icon}"></i></div></div>
            <h2>${neg ? 'امتیاز منفی' : stage.name}</h2>
            <div class="muted">امتیاز فعلی: <b class="${neg ? 'neg' : 'gold-text'}" style="font-size:1.2rem;">${p}</b></div>
            ${meta}
            <div class="bar"><div style="width:${pct}%; background:linear-gradient(90deg, ${color}, #FFD700);"></div></div>
            ${p === 0 ? '<p class="hint"><i class="fas fa-bolt"></i>اولین امتیازت رو بگیر!</p>' : ''}
            <div class="stats">
                <div class="stat"><i class="fas fa-coins"></i><b>${p}</b><span>امتیاز</span></div>
                <div class="stat"><i class="fas fa-ranking-star"></i><b>${rankTxt}</b><span>رتبه</span></div>
                <div class="stat"><i class="fas fa-flag-checkered"></i><b>${stage.next || neg ? left : '—'}</b><span>تا مرحله بعد</span></div>
            </div>`;
    }

    function renderLadder() {
        const stages = [
            { min: 0, max: 49, name: 'مرحله ۱: شروع', desc: 'شروع سفر رشد (۰ تا ۵۰ امتیاز)', icon: 'fa-seedling' },
            { min: 50, max: 149, name: 'مرحله ۲: کاوش', desc: 'کاوش و کشف توانمندی‌ها (۵۰ تا ۱۵۰)', icon: 'fa-magnifying-glass' },
            { min: 150, max: 299, name: 'مرحله ۳: پیشرفت', desc: 'پیشرفت مستمر (۱۵۰ تا ۳۰۰)', icon: 'fa-chart-line' },
            { min: 300, max: 499, name: 'مرحله ۴: درخشش', desc: 'درخشش در مسیر قهرمانی (۳۰۰ تا ۵۰۰)', icon: 'fa-star' },
            { min: 500, max: 99999, name: 'مرحله ۵: قهرمان', desc: 'رسیدن به قله قهرمانان (۵۰۰ به بالا)', icon: 'fa-trophy' }
        ];
        const p = me.points || 0;
        $('ladder-box').innerHTML = '<div class="ladder-line"></div>' + stages.map(s => {
            let cls = 'locked', icon = 'fa-lock', tag = '';
            if (p >= s.min && p <= s.max) { cls = 'active'; icon = s.icon; tag = '<span class="tag">مرحلهٔ فعلی</span>'; }
            else if (p > s.max) { cls = 'done'; icon = 'fa-check'; }
            return `<div class="ladder-step ${cls}">
                <div class="step-icon"><i class="fas ${icon}"></i></div>
                <div class="step-content"><div class="step-title">${s.name}${tag}</div><div class="step-desc">${s.desc}</div></div>
            </div>`;
        }).join('');
    }

    function renderLeaderboard() {
        if (board.length === 0) { $('leaderboard-body').innerHTML = '<div class="empty"><i class="fas fa-users"></i>هنوز دانش‌آموزی ثبت نشده</div>'; return; }
        const pc = ['#FFD700', '#C0C0C0', '#CD7F32'];
        const pts = (u) => `${u.points}`;
        let podium = '', start = 0;
        if (board.length >= 3) {
            const h = [96, 74, 58];
            const mk = (i) => {
                const u = board[i];
                return `<div class="pod ${i === 0 ? 'first' : ''} ${u.username === me.username ? 'me' : ''}" style="--pc:${pc[i]};">
                    <div class="av">${i === 0 ? '<i class="fas fa-crown crown"></i>' : ''}${esc(u.displayName.charAt(0))}</div>
                    <div class="nm">${esc(u.displayName)}</div>
                    <div class="pt">${pts(u)}</div>
                    <div class="base" style="height:${h[i]}px;"><i class="fas fa-medal"></i><span>${(i + 1).toLocaleString('fa-IR')}</span></div>
                </div>`;
            };
            podium = `<div class="podium">${mk(1)}${mk(0)}${mk(2)}</div>`;
            start = 3;
        }
        const rows = board.slice(start).map((u, k) => {
            const i = start + k, isMe = u.username === me.username;
            return `<div class="rank-row ${isMe ? 'me' : ''}">
                <div class="rank-num">${(i + 1).toLocaleString('fa-IR')}</div>
                <div class="rank-avatar">${esc(u.displayName.charAt(0))}</div>
                <div class="rank-name">${esc(u.displayName)}${isMe ? ' <span class="tag">شما</span>' : ''}</div>
                <div class="rank-pts ${u.points < 0 ? 'neg' : 'gold-text'}">${pts(u)} <small>امتیاز</small></div>
            </div>`;
        }).join('');
        $('leaderboard-body').innerHTML = podium + rows;
    }

    // === پیام‌ها ===
    const sendMessage = guard(async () => {
        const text = $('msg-text').value.trim();
        if (!text) return toast('متن پیام را بنویسید', 'err');
        await api('messages', 'POST', { text });
        $('msg-text').value = ''; $('msg-count').textContent = '0';
        toast('پیام برای ' + me.teacherName + ' ارسال شد');
        myMessages = await api('my-messages');
        renderMyMessages();
    });

    function renderMyMessages() {
        $('my-messages-box').innerHTML = myMessages.length === 0
            ? '<div class="empty"><i class="fas fa-comment-dots"></i>هنوز پیامی نفرستاده‌اید</div>'
            : myMessages.map(m => `
            <div class="msg-item">
                <div class="bubble me">${esc(m.text)}</div>
                <div class="msg-meta">${fa(m.createdAt)}</div>
                ${m.reply ? `<div class="bubble teacher"><b><i class="fas fa-reply"></i>${esc(me.teacherName)}</b>${esc(m.reply)}</div>`
                          : '<div class="msg-meta"><i class="fas fa-hourglass-half"></i> در انتظار پاسخ</div>'}
            </div>`).join('');
    }

    // === پنل مدیریت ===
    function renderAdminPanel() {
        const sel = $('admin-user-select');
        const prev = sel.value;
        sel.innerHTML = board.map(u => `<option value="${esc(u.username)}">${esc(u.displayName)} (${u.points})</option>`).join('');
        if (prev) sel.value = prev;

        $('admin-messages-box').innerHTML = adminMessages.length === 0
            ? '<div class="empty"><i class="fas fa-inbox"></i>پیامی وجود ندارد</div>'
            : adminMessages.map(m => `
            <div class="msg-item">
                <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;">
                    <b class="gold-text"><i class="fas fa-user"></i> ${esc(m.fromName)}</b>
                    <span class="msg-meta" style="margin:0;">${fa(m.createdAt)}</span>
                </div>
                <div class="bubble me">${esc(m.text)}</div>
                ${m.reply ? `<div class="bubble teacher"><b><i class="fas fa-reply"></i>پاسخ شما</b>${esc(m.reply)}</div>` : `
                <div class="reply-row">
                    <input type="text" maxlength="500" class="neo-input" placeholder="نوشتن پاسخ...">
                    <button class="btn-gold" data-id="${esc(m.id)}" onclick="replyMsg(this)" aria-label="ارسال پاسخ"><i class="fas fa-paper-plane"></i></button>
                </div>`}
            </div>`).join('');

        $('admin-log-box').innerHTML = adminLog.length === 0
            ? '<div class="empty"><i class="fas fa-clock-rotate-left"></i>هنوز امتیازی ثبت نشده</div>'
            : adminLog.map(l => `
            <div class="log-row">
                <div><b>${esc(l.toName)}</b> <b class="${l.amount > 0 ? 'pos' : 'neg'}" dir="ltr">${l.amount > 0 ? '+' : ''}${l.amount}</b>
                ${l.reason ? `<div class="muted" style="font-size:.78rem;">${esc(l.reason)}</div>` : ''}</div>
                <time>${fa(l.at)}</time>
            </div>`).join('');
    }

    const replyMsg = guard(async (btn) => {
        const reply = btn.previousElementSibling.value.trim();
        if (!reply) return;
        await api('admin/messages/' + encodeURIComponent(btn.dataset.id) + '/reply', 'POST', { reply });
        adminMessages = await api('admin/messages');
        renderAdminPanel();
        toast('پاسخ ارسال شد');
    });

    const updatePoints = guard(async (action) => {
        const username = $('admin-user-select').value;
        const p = parseInt($('admin-points-input').value, 10);
        const reason = $('admin-reason-input').value.trim();
        if (!username || isNaN(p) || p <= 0) return toast('دانش‌آموز را انتخاب کن و یک عدد مثبت وارد کن', 'err');
        if (action < 0 && !confirm('از کم کردن ' + p + ' امتیاز مطمئنی؟')) return;
        await api('admin/points', 'POST', { username, amount: p * action, reason });
        $('admin-points-input').value = ''; $('admin-reason-input').value = '';
        await loadAll();
        toast('امتیاز بروزرسانی شد');
    });

    const addNewUser = guard(async () => {
        const displayName = $('new-user-display').value.trim();
        const username = $('new-user-username').value.trim().toLowerCase();
        if (!displayName || !username) return toast('هر دو فیلد را پر کن', 'err');
        const r = await api('admin/students', 'POST', { displayName, username });
        $('new-user-display').value = ''; $('new-user-username').value = '';
        await loadAll();
        prompt('کاربر اضافه شد! رمز موقت (فقط همین یک بار نمایش داده می‌شود، کپی کن):', r.tempPassword);
    });

    const resetPassword = guard(async () => {
        const sel = $('admin-user-select');
        if (!sel.value || !confirm('رمز این دانش‌آموز بازنشانی شود؟')) return;
        const r = await api('admin/students/' + encodeURIComponent(sel.value) + '/reset-password', 'POST');
        prompt('رمز موقت جدید (فقط همین یک بار نمایش داده می‌شود):', r.tempPassword);
    });

    const deleteStudent = guard(async () => {
        const sel = $('admin-user-select');
        if (!sel.value || !confirm('این دانش‌آموز برای همیشه حذف شود؟')) return;
        await api('admin/students/' + encodeURIComponent(sel.value), 'DELETE');
        await loadAll();
        toast('دانش‌آموز حذف شد');
    });

    // === شروع ===
    window.onload = async function () {
        if (token) { try { await loadAll(); } catch (e) { console.error(e); } }
    };
    </script>
</body>
</html>
